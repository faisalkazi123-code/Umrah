<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5135" />
    <meta name="description" content="Step-by-step Umrah companion that works offline." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Umrah Companion</title>
    <style>
      /* Splash shown until the app has restored saved progress. */
      #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f7f4ee; }
      @media (prefers-color-scheme: dark) { #splash { background: #17191b; } }
      #root:not(:empty) + #splash { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true"><img src="/icons/icon.svg" width="96" height="96" alt="" /></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
